<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Hacé Cabeza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: una sola columna tipo "mesa de adivino" — el Cabezón arriba, la pregunta en su globo, respuestas apiladas al pulgar */
:root{
--night:#141226; --panel:#1f1c38; --line:#34305a;
--gold:#f4b63f; --celeste:#86cdf5; --cream:#f5eedf; --muted:#a9a3c7; --no:#ef7a6a;
--display:"Bungee","Arial Black",Impact,sans-serif;
--body:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.45;
background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2b2660 0%, transparent 70%);
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:540px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,3.6rem);line-height:.95;margin:0;color:var(--gold);text-align:center;letter-spacing:.01em;text-shadow:0 3px 0 #7a4f0c}
.tag{font-family:var(--display);font-size:.72rem;letter-spacing:.14em;color:var(--celeste);text-align:center;margin:0}
p{margin:0}
.lead{text-align:center;color:var(--muted);text-wrap:balance}
.faces{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.face{aspect-ratio:1;max-width:100%;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--panel);padding:0;cursor:default}
.face img{width:100%;height:100%;object-fit:cover;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--celeste);outline-offset:3px}
.big{font-family:var(--display);font-size:1.15rem;background:var(--gold);color:#2a1a00;border:0;border-radius:14px;padding:16px 20px;box-shadow:0 5px 0 #a66d0c;transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #a66d0c}
.ghost{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:.9rem}
.oracle{display:flex;justify-content:center}
.oracle svg{width:150px;height:auto}
.bubble{position:relative;background:var(--cream);color:#1b1830;border-radius:18px;padding:18px 20px;font-size:1.3rem;font-weight:800;line-height:1.25;text-align:center;text-wrap:balance;min-height:3.5em;display:flex;align-items:center;justify-content:center}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:var(--cream)}
.src{margin:-8px 0 0;text-align:center;font-family:var(--display);font-size:.62rem;letter-spacing:.16em;color:var(--celeste)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-size:.7rem;letter-spacing:.12em;color:var(--muted)}
.meter{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--celeste),var(--gold));transition:width .4s}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600;font-size:1.05rem;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.ans:hover{border-color:var(--celeste)}
.ans b{font-family:var(--display);font-weight:400;width:2.1em;height:2.1em;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--line)}
.ans[data-a="1"] b{background:var(--gold);color:#2a1a00}
.ans[data-a="0"] b{background:var(--no);color:#2a0a05}
.reveal{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.photo{width:min(260px,70vw);aspect-ratio:1;border-radius:22px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 6px #f4b63f22,0 20px 50px #0008;transform:rotate(-2deg)}
.photo img{width:100%;height:100%;object-fit:cover}
.name{font-family:var(--display);font-size:clamp(1.6rem,8vw,2.2rem);line-height:1;color:var(--gold);margin:0}
.nick{color:var(--celeste);font-weight:600}
.fact{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--cream);max-width:40ch}
.row{display:flex;gap:10px;width:100%}
.row .big{flex:1}
.big.no{background:var(--no);box-shadow:0 5px 0 #9c3f31}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;width:100%}
.pick button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
.pick button:hover{border-color:var(--gold)}
.pick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.small{font-size:.85rem;color:var(--muted);text-align:center}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.meter i{transition:none}}
</style>
</head><body>
<div class="wrap">
<section id="intro" class="pop" style="display:flex;flex-direction:column;gap:18px">
<p class="tag">EL ADIVINO DEL GRUPO</p>
<h1>HACÉ<br>CABEZA</h1>
<div class="oracle" id="oracleIntro"></div>
<p class="lead">Pensá en uno de los 14. Yo te hago preguntas y lo adivino. Cuanto más contestes, menos me equivoco.</p>
<div class="faces" id="faces"></div>
<button class="big" id="start">Ya pensé en uno</button>
</section>
<section id="play" hidden style="display:flex;flex-direction:column;gap:18px">
<div class="oracle" id="oracle"></div>
<div class="bubble" id="question"></div>
<p class="src" id="src" hidden>SACADA DEL CHAT</p>
<div class="meta"><span id="qnum">PREGUNTA 1</span><div class="meter" aria-hidden="true"><i id="meter"></i></div><span id="conf">0%</span></div>
<div class="answers">
<button class="ans" data-a="1"><b>SÍ</b>Sí</button>
<button class="ans" data-a="0.75"><b>+</b>Probablemente sí</button>
<button class="ans" data-a="null"><b>?</b>No sé</button>
<button class="ans" data-a="0.25"><b>−</b>Probablemente no</button>
<button class="ans" data-a="0"><b>NO</b>No</button>
</div>
<button class="ghost" id="undo">Volver a la anterior</button>
</section>
<section id="guess" hidden class="reveal">
<div class="oracle" id="oracleGuess"></div>
<p class="tag" id="guessTag">ESTOY PENSANDO EN…</p>
<div class="photo"><img id="gImg" alt=""></div>
<p class="name" id="gName"></p>
<p class="nick" id="gNick"></p>
<div class="row"><button class="big" id="yes">¡Es él!</button><button class="big no" id="nope">No</button></div>
</section>
<section id="win" hidden class="reveal">
<p class="tag">LO SABÍA</p>
<div class="photo"><img id="wImg" alt=""></div>
<p class="name" id="wName"></p>
<p class="nick" id="wNick"></p>
<p class="fact" id="wFact"></p>
<p class="small" id="wStats"></p>
<button class="big" id="again">Jugar otra</button>
</section>
<section id="lose" hidden class="reveal">
<div class="oracle" id="oracleLose"></div>
<p class="name">ME GANASTE</p>
<p class="lead" id="loseLead">¿En quién estabas pensando? Así aprendo para la próxima.</p>
<div class="pick" id="pick"></div>
<button class="ghost" id="again2">Jugar otra</button>
</section>
</div>

function makeEngine(PEOPLE,QUESTIONS,overrides){
const N=PEOPLE.length;
const val=(qi,pi)=>{const id=PEOPLE[pi].id;const o=overrides&&overrides[qi]&&overrides[qi][id];if(o!=null)return o;const q=QUESTIONS[qi];return q.v[id]!=null?q.v[id]:q.d;};
const like=(a,v)=>0.22+0.78*Math.pow(1-Math.abs(a-v),1.6);
const S={p:Array(N).fill(1/N),asked:[],hist:[],rejected:new Set()};
function norm(p){let s=p.reduce((a,b)=>a+b,0);return s>0?p.map(x=>x/s):p.map(()=>1/N);}
function H(p){return -p.reduce((a,x)=>a+(x>0?x*Math.log2(x):0),0);}
function post(p,qi,a){return norm(p.map((x,i)=>x*like(a,val(qi,i))));}
function score(qi){const p=S.p;let py=0;p.forEach((x,i)=>py+=x*val(qi,i));
return py*H(post(p,qi,1))+(1-py)*H(post(p,qi,0));}
function next(rand=Math.random){
const cand=[];for(let qi=0;qi<QUESTIONS.length;qi++){if(S.asked.includes(qi))continue;const n=S.asked.length;const q=QUESTIONS[qi];let pen=0;const ones=PEOPLE.filter((pp,i)=>val(qi,i)>=.75).length;if(ones<=1)pen+=n<10?2:0.3;if(/Se llama|Le dicen "el|Le dicen "la|Le dicen "K|Le dicen "el puma|virrey/.test(q.q))pen+=n<14?3:0.5;cand.push([score(qi)-(q.s?0.15:0)+pen,qi]);}
cand.sort((a,b)=>a[0]-b[0]);
const k=S.asked.length<4?Math.min(6,cand.length):Math.min(3,cand.length);
// pick among top k only if close
const pool=cand.slice(0,k).filter(c=>c[0]<=cand[0][0]+0.35);
return pool[Math.floor(rand()*pool.length)][1];
}
function answer(qi,a){S.hist.push({qi,a,p:S.p.slice()});S.asked.push(qi);if(a!=null)S.p=post(S.p,qi,a);}
function undo(){const h=S.hist.pop();if(!h)return null;S.p=h.p;S.asked.pop();return h.qi;}
function top(){let b=0;S.p.forEach((x,i)=>{if(x>S.p[b])b=i});return b;}
function reject(i){S.rejected.add(i);S.p[i]=0;S.p=norm(S.p);}
function shouldGuess(){const t=top();const n=S.asked.length;return (S.p[t]>0.97&&n>=12)||n>=28||(n>=20&&S.p[t]>0.6);}
return {S,next,answer,undo,top,reject,shouldGuess,val};
}
